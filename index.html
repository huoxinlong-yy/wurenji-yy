<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无人机驾驶员刷题系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  min-height: 100vh; color: #e2e8f0;
}
.header {
  background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(59, 130, 246, 0.3);
  padding: 16px 24px; text-align: center;
}
.header h1 {
  font-size: 24px; background: linear-gradient(90deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
.container { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
/* Home screen */
.home { text-align: center; padding-top: 40px; }
.home h2 { font-size: 22px; margin-bottom: 12px; color: #f1f5f9; }
.home p { color: #94a3b8; margin-bottom: 32px; font-size: 15px; }
.mode-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.mode-card {
  background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 16px; padding: 32px 24px; width: 260px; cursor: pointer;
  transition: all 0.3s; text-align: center;
}
.mode-card:hover {
  border-color: #3b82f6; transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(59, 130, 246, 0.2);
}
.mode-card .icon { font-size: 40px; margin-bottom: 12px; }
.mode-card h3 { font-size: 18px; margin-bottom: 8px; color: #e2e8f0; }
.mode-card p { font-size: 13px; color: #94a3b8; }
/* Quantity selector */
.qty-selector {
  margin-top: 32px; padding: 24px;
  background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 16px; text-align: center;
}
.qty-selector h3 { font-size: 16px; color: #f1f5f9; margin-bottom: 16px; }
.qty-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.qty-btn {
  background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(71, 85, 105, 0.6);
  border-radius: 10px; padding: 12px 24px; cursor: pointer;
  transition: all 0.2s; color: #e2e8f0; font-size: 14px; font-weight: 600;
}
.qty-btn:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
.qty-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
.qty-btn.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
/* Quiz */
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; font-size: 14px; color: #94a3b8;
}
.progress-bar {
  width: 100%; height: 6px; background: rgba(51, 65, 85, 0.8);
  border-radius: 3px; margin-bottom: 20px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  border-radius: 3px; transition: width 0.3s;
}
.question-card {
  background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(51, 65, 85, 0.8);
  border-radius: 16px; padding: 24px; margin-bottom: 16px;
}
.question-num {
  display: inline-block; background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  color: #fff; font-size: 12px; font-weight: 600;
  padding: 2px 10px; border-radius: 10px; margin-bottom: 12px;
}
.question-text { font-size: 16px; line-height: 1.7; color: #f1f5f9; }
.options { margin-top: 16px; }
.option {
  display: block; width: 100%;
  background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(71, 85, 105, 0.6);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer; transition: all 0.2s; text-align: left;
  color: #e2e8f0; font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
.option.selected {
  border-color: #3b82f6; background: rgba(59, 130, 246, 0.15);
  color: #93c5fd;
}
.option.correct {
  border-color: #22c55e !important; background: rgba(34, 197, 94, 0.15) !important;
  color: #86efac !important;
}
.option.wrong {
  border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.15) !important;
  color: #fca5a5 !important;
}
.option .label {
  display: inline-block; width: 26px; height: 26px;
  line-height: 26px; text-align: center; border-radius: 50%;
  background: rgba(71, 85, 105, 0.6); margin-right: 10px;
  font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .label { background: #3b82f6; color: #fff; }
.option.correct .label { background: #22c55e; color: #fff; }
.option.wrong .label { background: #ef4444; color: #fff; }
.explanation {
  margin-top: 16px; padding: 12px 16px;
  background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.2);
  border-radius: 10px; font-size: 14px; color: #86efac;
}
.btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.btn {
  padding: 12px 28px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; color: #fff;
}
.btn-primary { background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); }
.btn-secondary { background: rgba(51, 65, 85, 0.8); border: 1px solid rgba(71, 85, 105, 0.6); }
.btn-secondary:hover { background: rgba(71, 85, 105, 0.8); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
/* Result */
.result { text-align: center; padding-top: 30px; }
.result .score-ring {
  width: 180px; height: 180px; margin: 0 auto 24px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.result .score-num { font-size: 48px; font-weight: 700; }
.result .score-label { font-size: 14px; color: #94a3b8; }
.result h2 { font-size: 22px; margin-bottom: 8px; }
.result p { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
.stat-row { display: flex; gap: 16px; justify-content: center; margin-bottom: 32px; }
.stat-item {
  background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(51, 65, 85, 0.8);
  border-radius: 12px; padding: 16px 24px; text-align: center; min-width: 100px;
}
.stat-item .val { font-size: 28px; font-weight: 700; }
.stat-item .lbl { font-size: 12px; color: #94a3b8; margin-top: 4px; }
.stat-item.correct-stat .val { color: #22c55e; }
.stat-item.wrong-stat .val { color: #ef4444; }
/* Wrong list */
.wrong-list { text-align: left; margin-top: 24px; }
.wrong-item {
  background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
.wrong-item .q-text { font-size: 14px; color: #f1f5f9; margin-bottom: 8px; }
.wrong-item .answer-row { font-size: 13px; }
.wrong-item .your-ans { color: #fca5a5; }
.wrong-item .right-ans { color: #86efac; }
.hidden { display: none; }
/* Mobile responsive */
@media (max-width: 600px) {
  .header { padding: 12px 16px; }
  .header h1 { font-size: 18px; }
  .header p { font-size: 12px; }
  .container { padding: 12px 10px; }
  .home { padding-top: 20px; }
  .home h2 { font-size: 18px; margin-bottom: 8px; }
  .home p { font-size: 13px; margin-bottom: 24px; }
  .mode-cards { flex-direction: column; gap: 12px; }
  .mode-card { width: 100%; padding: 20px 16px; }
  .mode-card .icon { font-size: 32px; }
  .mode-card h3 { font-size: 16px; }
  .mode-card p { font-size: 12px; }
  .qty-selector { margin-top: 20px; padding: 16px; }
  .qty-selector h3 { font-size: 14px; }
  .qty-btns { gap: 8px; }
  .qty-btn { padding: 10px 16px; font-size: 13px; }
  .quiz-header { font-size: 13px; }
  .question-card { padding: 16px; }
  .question-text { font-size: 15px; line-height: 1.6; }
  .option { padding: 12px 14px; font-size: 13px; line-height: 1.4; }
  .option .label { width: 24px; height: 24px; line-height: 24px; font-size: 12px; margin-right: 8px; }
  .explanation { padding: 10px 14px; font-size: 13px; }
  .btn-row { gap: 8px; margin-top: 16px; }
  .btn { padding: 10px 20px; font-size: 14px; }
  .result .score-ring { width: 140px; height: 140px; }
  .result .score-num { font-size: 36px; }
  .result .score-label { font-size: 12px; }
  .result h2 { font-size: 18px; }
  .result p { font-size: 13px; }
  .stat-row { gap: 10px; flex-wrap: wrap; }
  .stat-item { padding: 12px 16px; min-width: 80px; }
  .stat-item .val { font-size: 22px; }
  .wrong-item { padding: 12px; }
  .wrong-item .q-text { font-size: 13px; }
  .wrong-item .answer-row { font-size: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>无人机驾驶员刷题系统</h1>
  <p>无人机驾驶员（初级）复习题 - 共150题</p>
</div>

<div class="container">
  <!-- Home -->
  <div id="home" class="home">
    <h2>选择刷题模式</h2>
    <p>从150道题库中选择你的刷题方式</p>
    <div class="mode-cards">
      <div class="mode-card" onclick="startQuiz('order')">
        <div class="icon">&#128218;</div>
        <h3>按序刷题</h3>
        <p>从第1题到第150题，按顺序逐题练习</p>
      </div>
      <div class="mode-card" onclick="selectRandomMode()">
        <div class="icon">&#127922;</div>
        <h3>随机刷题</h3>
        <p>随机抽取题目，分段练习，检验掌握程度</p>
      </div>
    </div>
    <!-- 题量选择面板 -->
    <div id="qty-panel" class="qty-selector hidden">
      <h3>选择每次刷题数量</h3>
      <div class="qty-btns">
        <div class="qty-btn" onclick="selectQty(10, this)">10 题</div>
        <div class="qty-btn" onclick="selectQty(20, this)">20 题</div>
        <div class="qty-btn" onclick="selectQty(30, this)">30 题</div>
        <div class="qty-btn" onclick="selectQty(150, this)">全部 150 题</div>
      </div>
    </div>
  </div>

  <!-- Quiz -->
  <div id="quiz" class="hidden">
    <div class="quiz-header">
      <span id="mode-label"></span>
      <span id="progress-text"></span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div class="question-card">
      <div id="question-num" class="question-num"></div>
      <div id="question-text" class="question-text"></div>
      <div id="options" class="options"></div>
      <div id="explanation" class="explanation hidden"></div>
    </div>
    <div class="btn-row">
      <button id="btn-prev" class="btn btn-secondary" onclick="prevQuestion()">&#8592; 上一题</button>
      <button id="btn-next" class="btn btn-primary" onclick="nextQuestion()">下一题 &#8594;</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="result hidden">
    <div class="score-ring" id="score-ring">
      <div class="score-num" id="score-num">0%</div>
      <div class="score-label">正确率</div>
    </div>
    <h2 id="result-title">练习完成</h2>
    <p id="result-desc"></p>
    <div class="stat-row">
      <div class="stat-item correct-stat">
        <div class="val" id="correct-count">0</div>
        <div class="lbl">正确</div>
      </div>
      <div class="stat-item wrong-stat">
        <div class="val" id="wrong-count">0</div>
        <div class="lbl">错误</div>
      </div>
      <div class="stat-item">
        <div class="val" id="total-count">0</div>
        <div class="lbl">总题数</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="goHome()">返回首页</button>
      <button class="btn btn-primary" onclick="reviewWrong()">查看错题</button>
      <button id="btn-redo-wrong" class="btn btn-primary hidden" onclick="redoWrong()">错题重答</button>
      <button class="btn btn-primary" onclick="restartQuiz()">再做一次</button>
      <button id="btn-continue" class="btn btn-primary hidden" onclick="continueRandom()">继续随机刷题</button>
    </div>
    <div id="wrong-list" class="wrong-list hidden"></div>
  </div>
</div>

<script>

let currentQuestions = [];
let currentIndex = 0;
let userAnswers = {};
let mode = '';
let answered = {};
let selectedQty = 0; // 记录随机刷题选择的题量

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 点击随机刷题卡片，显示题量选择面板
function selectRandomMode() {
  const panel = document.getElementById('qty-panel');
  panel.classList.toggle('hidden');
  // 清除之前选中状态
  document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
  selectedQty = 0;
}

// 选择题量后开始随机刷题
function selectQty(qty, btn) {
  selectedQty = qty;
  document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  startQuiz('random');
}

function startQuiz(m) {
  mode = m;
  if (m === 'random') {
    const shuffled = shuffle(QUESTIONS);
    const qty = selectedQty || shuffled.length;
    currentQuestions = shuffled.slice(0, Math.min(qty, shuffled.length));
  } else {
    currentQuestions = [...QUESTIONS];
  }
  currentIndex = 0;
  userAnswers = {};
  answered = {};
  document.getElementById('home').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  const label = m === 'random'
    ? `随机模式（${currentQuestions.length}题）`
    : '按序模式';
  document.getElementById('mode-label').textContent = label;
  renderQuestion();
}

function renderQuestion() {
  // 清除之前的自动跳转定时器
  if (autoNextTimer) {
    clearInterval(autoNextTimer);
    autoNextTimer = null;
  }
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;
  document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / total) * 100}%`;
  document.getElementById('question-num').textContent = `第 ${q.id} 题`;
  document.getElementById('question-text').textContent = q.question;

  const optContainer = document.getElementById('options');
  optContainer.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="label">${opt.label}</span>${opt.text}`;
    btn.onclick = () => selectOption(q.id, opt.label, btn);
    if (answered[q.id]) {
      btn.style.pointerEvents = 'none';
      if (opt.label === q.answer) btn.classList.add('correct');
      if (opt.label === userAnswers[q.id] && opt.label !== q.answer) btn.classList.add('wrong');
      if (opt.label === userAnswers[q.id]) btn.classList.add('selected');
    }
    optContainer.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  if (answered[q.id]) {
    exp.classList.remove('hidden');
    const isCorrect = userAnswers[q.id] === q.answer;
    exp.textContent = isCorrect ? '回答正确！' : `回答错误，正确答案是 ${q.answer}`;
    exp.style.background = isCorrect ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';
    exp.style.borderColor = isCorrect ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)';
    exp.style.color = isCorrect ? '#86efac' : '#fca5a5';
  } else {
    exp.classList.add('hidden');
  }

  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').textContent = currentIndex === total - 1 ? '查看结果' : '下一题 →';
}

let autoNextTimer = null;

function selectOption(qId, label, btn) {
  if (answered[qId]) return;
  answered[qId] = true;
  userAnswers[qId] = label;
  const q = currentQuestions[currentIndex];
  const allBtns = document.querySelectorAll('.option');
  allBtns.forEach(b => { b.style.pointerEvents = 'none'; });
  if (label === q.answer) {
    btn.classList.add('selected', 'correct');
  } else {
    btn.classList.add('selected', 'wrong');
    allBtns.forEach(b => {
      const bLabel = b.querySelector('.label').textContent;
      if (bLabel === q.answer) b.classList.add('correct');
    });
  }
  const exp = document.getElementById('explanation');
  exp.classList.remove('hidden');
  const isCorrect = label === q.answer;
  const baseText = isCorrect ? '回答正确！' : `回答错误，正确答案是 ${q.answer}`;
  exp.style.background = isCorrect ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';
  exp.style.borderColor = isCorrect ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)';
  exp.style.color = isCorrect ? '#86efac' : '#fca5a5';

  // 5秒倒计时自动跳转
  if (autoNextTimer) clearInterval(autoNextTimer);
  let countdown = 5;
  exp.textContent = baseText + `  (${countdown}s后自动下一题)`;
  autoNextTimer = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      exp.textContent = baseText + `  (${countdown}s后自动下一题)`;
    } else {
      clearInterval(autoNextTimer);
      nextQuestion();
    }
  }, 1000);
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('wrong-list').classList.add('hidden');

  let correct = 0, wrong = 0, unanswered = 0;
  const wrongItems = [];
  currentQuestions.forEach(q => {
    if (!answered[q.id]) {
      unanswered++;
      wrongItems.push(q);
    } else if (userAnswers[q.id] === q.answer) {
      correct++;
    } else {
      wrong++;
      wrongItems.push(q);
    }
  });
  const answered_count = correct + wrong;
  const total = currentQuestions.length;
  const rate = answered_count > 0 ? Math.round((correct / answered_count) * 100) : 0;

  document.getElementById('score-num').textContent = rate + '%';
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong + unanswered;
  document.getElementById('total-count').textContent = total;

  const ring = document.getElementById('score-ring');
  const hue = rate * 1.2;
  ring.style.background = `conic-gradient(hsl(${hue},70%,50%) ${rate * 3.6}deg, rgba(51,65,85,0.5) 0deg)`;
  ring.style.padding = '6px';
  ring.innerHTML = `<div style="width:168px;height:168px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;flex-direction:column"><div class="score-num" style="color:hsl(${hue},70%,60%)">${rate}%</div><div class="score-label">正确率</div></div>`;

  if (mode === 'wrong') {
    document.getElementById('result-title').textContent = '错题重答完成';
    document.getElementById('result-desc').textContent = `本次重答 ${total} 道错题，答对 ${correct} 题，正确率 ${rate}%`;
  } else if (rate >= 90) {
    document.getElementById('result-title').textContent = '太棒了！';
    document.getElementById('result-desc').textContent = '你对无人机知识掌握得非常好！';
  } else if (rate >= 70) {
    document.getElementById('result-title').textContent = '还不错！';
    document.getElementById('result-desc').textContent = '继续加油，争取更高分数！';
  } else if (rate >= 50) {
    document.getElementById('result-title').textContent = '继续努力！';
    document.getElementById('result-desc').textContent = '还需要多加练习哦！';
  } else {
    document.getElementById('result-title').textContent = '需要加油！';
    document.getElementById('result-desc').textContent = '建议重新复习知识点再来刷题！';
  }

  // 随机模式下显示"继续随机刷题"按钮
  const btnContinue = document.getElementById('btn-continue');
  if (mode === 'random') {
    btnContinue.classList.remove('hidden');
  } else {
    btnContinue.classList.add('hidden');
  }
  // 有错题时显示"错题重答"按钮
  const btnRedoWrong = document.getElementById('btn-redo-wrong');
  if (wrongItems.length > 0) {
    btnRedoWrong.classList.remove('hidden');
  } else {
    btnRedoWrong.classList.add('hidden');
  }

  // Store wrong items for review
  window._wrongItems = wrongItems;
}

function reviewWrong() {
  const list = document.getElementById('wrong-list');
  if (!list.classList.contains('hidden')) {
    list.classList.add('hidden');
    return;
  }
  list.classList.remove('hidden');
  list.innerHTML = '<h3 style="margin-bottom:16px;color:#f1f5f9">错题回顾</h3>';
  window._wrongItems.forEach(q => {
    const isUnanswered = !answered[q.id];
    const yourAns = isUnanswered ? '未作答' : userAnswers[q.id];

    const item = document.createElement('div');
    item.className = 'wrong-item';

    // 题目
    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = q.id + '. ' + q.question;
    item.appendChild(qText);

    // 选项
    const optBox = document.createElement('div');
    optBox.style.cssText = 'margin:10px 0;padding:8px 12px;background:rgba(15,23,42,0.4);border-radius:8px;';
    if (q.options && q.options.length > 0) {
      q.options.forEach(opt => {
        const optDiv = document.createElement('div');
        optDiv.style.cssText = 'margin:5px 0;font-size:13px;line-height:1.5;';
        if (opt.label === q.answer) {
          optDiv.style.color = '#86efac';
          optDiv.style.fontWeight = '600';
          optDiv.textContent = opt.label + '. ' + opt.text + '  ✓ 正确答案';
        } else if (opt.label === yourAns && yourAns !== q.answer) {
          optDiv.style.color = '#fca5a5';
          optDiv.textContent = opt.label + '. ' + opt.text + '  ✗ 你的答案';
        } else {
          optDiv.style.color = '#94a3b8';
          optDiv.textContent = opt.label + '. ' + opt.text;
        }
        optBox.appendChild(optDiv);
      });
    } else {
      optBox.textContent = '（无选项数据）';
      optBox.style.color = '#ef4444';
    }
    item.appendChild(optBox);

    // 答案对比
    const ansRow = document.createElement('div');
    ansRow.className = 'answer-row';
    ansRow.innerHTML = '<span class="your-ans">你的答案：' + yourAns + '</span><span style="margin:0 8px">|</span><span class="right-ans">正确答案：' + q.answer + '</span>';
    item.appendChild(ansRow);

    list.appendChild(item);
  });
}

function goHome() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('qty-panel').classList.add('hidden');
  document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('home').classList.remove('hidden');
}

function restartQuiz() {
  if (mode === 'wrong') {
    // 错题重答模式下，再做一次即重新做这批错题
    redoWrong();
  } else {
    startQuiz(mode);
  }
}

// 继续随机刷题：用相同题量再随机抽一批新题
function continueRandom() {
  startQuiz('random');
}

// 错题重答：只重新做之前做错的题
function redoWrong() {
  const wrongItems = window._wrongItems || [];
  if (wrongItems.length === 0) return;
  // 随机打乱错题顺序
  currentQuestions = shuffle(wrongItems);
  mode = 'wrong';
  currentIndex = 0;
  userAnswers = {};
  answered = {};
  document.getElementById('result').classList.add('hidden');
  document.getElementById('wrong-list').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('mode-label').textContent = `错题重答（${currentQuestions.length}题）`;
  renderQuestion();
}
</script>
</body>
</html>
